# KerryOS egress proxy config (Tinyproxy).
#
# Deny-by-default domain allowlist: FilterDefaultDeny Yes means only domains
# matching /etc/tinyproxy/filter may be fetched; everything else is denied
# with HTTP 403. Private-IP destinations are blocked independently by
# nftables rule 8 (this container can only reach public IPs).

User tinyproxy
Group tinyproxy

Port 3128
Listen 0.0.0.0

Timeout 600

# Only the guest bridge may use this proxy.
# (Belt: nftables rule 2 already restricts this; this is defense in depth.)
Allow 172.28.0.0/24

Filter "/etc/tinyproxy/filter"
FilterURLs Off
FilterDefaultDeny Yes

LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
PidFile "/run/tinyproxy/tinyproxy.pid"

MaxClients 100
MinSpareServers 5
MaxSpareServers 20
StartServers 10
MaxRequestsPerChild 0

# Don't advertise the proxy.
DisableViaHeader Yes
