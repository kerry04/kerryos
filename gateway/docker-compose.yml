name: kerryos

# KerryOS gateway stack. Run from this directory: docker compose up -d
# Requires a .env file at the repo root (copy ../.env.example).
# Guacamole DB schema: run scripts/init-db.sh once on brain 67 before first up.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Generated by scripts/init-db.sh (one-time). Only runs on a fresh data dir.
      - ./guacamole/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    networks:
      br-kerryos:
        ipv4_address: 172.28.0.70

  guacd:
    # Official guacamole/guacd is AMD64-only (crash-loops on ARM64).
    # linuxserver.io's build is the same guacd, multi-arch incl. arm64.
    image: lscr.io/linuxserver/guacd:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:4822:4822"
    networks:
      br-kerryos:
        ipv4_address: 172.28.0.60

  guacamole:
    # Built from official Apache source for ARM64 (see ./guacamole-webapp/).
    # The official guacamole/guacamole image is AMD64-only.
    build: ./guacamole-webapp
    restart: unless-stopped
    depends_on:
      - postgres
      - guacd
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./guacamole/guacamole.properties:/etc/guacamole/guacamole.properties:ro
    networks:
      br-kerryos:
        ipv4_address: 172.28.0.30

  proxy:
    # Built by the egress team from ../egress/Dockerfile (Tinyproxy).
    build: ../egress
    restart: unless-stopped
    networks:
      br-kerryos:
        ipv4_address: 172.28.0.20

  broker:
    # Built by the broker team from ../broker/Dockerfile (in progress in parallel).
    build: ../broker
    restart: unless-stopped
    depends_on:
      - guacamole
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ../.env
    volumes:
      # Broker needs Docker to start/stop the per-session guest containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - broker-data:/data
    networks:
      br-kerryos:
        ipv4_address: 172.28.0.40

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - broker
      - guacamole
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../.env
    volumes:
      - ./guacamole/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      br-kerryos:
        ipv4_address: 172.28.0.50

networks:
  br-kerryos:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  broker-data:
  caddy-data:
  caddy-config:
