name: kerryos

# KerryOS gateway stack. Run from this directory: docker compose up -d
# Requires a .env file at the repo root (copy ../.env.example).
# Guacamole DB schema: run scripts/init-db.sh once on brain 67 before first up.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: guacamole_db
      POSTGRES_USER: guacamole_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Generated by scripts/init-db.sh (one-time). Only runs on a fresh data dir.
      - ./guacamole/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    networks:
      br-kerryos:
        ipv4_address: 172.28.0.70

  guacd:
    # Both prebuilt guacd images fail on ARM64: official guacamole/guacd:1.5.5
    # is AMD64-only (exec format error), and lscr.io/linuxserver/guacd:latest
    # ships without a working guacd binary (4822 never opens). Built instead
    # from the Apache 1.5.5 source tarball (vendored, sha256-verified).
    build: ./guacd-arm64
    image: kerryos/guacd-arm64:1.5.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:4822:4822"
    networks:
      br-kerryos:
        ipv4_address: 172.28.0.60

  guacamole:
    # Built from official Apache source for ARM64 (see ./guacamole-webapp/).
    # The official guacamole/guacamole image is AMD64-only.
    build: ./guacamole-webapp
    restart: unless-stopped
    depends_on:
      - postgres
      - guacd
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Entry script renders the ${VAR}-templated properties at container start
      # (Guacamole 1.5.5 alone does not expand them).
      - ./guacamole/guacamole.properties.template:/etc/guacamole/guacamole.properties.template:ro
    networks:
      br-kerryos:
        ipv4_address: 172.28.0.30

  proxy:
    # Built by the egress team from ../egress/Dockerfile (Tinyproxy).
    build: ../egress
    restart: unless-stopped
    networks:
      br-kerryos:
        ipv4_address: 172.28.0.20

  broker:
    # Built by the broker team from ../broker/Dockerfile (in progress in parallel).
    build: ../broker
    restart: unless-stopped
    depends_on:
      - guacamole
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ../.env
    volumes:
      # Broker needs Docker to start/stop the per-session guest containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - broker-data:/data
    networks:
      br-kerryos:
        ipv4_address: 172.28.0.40

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - broker
      - guacamole
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - ../.env
    volumes:
      - ./guacamole/Caddyfile:/etc/caddy/Caddyfile:ro
      # Phase 3: static frontend for the KerryOS front door (boot screen +
      # iframe viewer). Served at /kerryos-frontend/ so the portfolio landing
      # at / is untouched until we flip the root handler on.
      - ../frontend-snippet:/srv/kerryos-frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      br-kerryos:
        ipv4_address: 172.28.0.50

networks:
  br-kerryos:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  broker-data:
  caddy-data:
  caddy-config:
